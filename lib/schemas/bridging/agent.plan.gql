interface Agent {
  plans(first: Int, after: String, last: Int, before: String): PlanConnection!
}

type Person implements Agent {
  plans(first: Int, after: String, last: Int, before: String): PlanConnection!
}

type Organization implements Agent {
  plans(first: Int, after: String, last: Int, before: String): PlanConnection!
}
