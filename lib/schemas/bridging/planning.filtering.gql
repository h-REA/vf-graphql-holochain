##
# Query filtering parameters for the Planning module
#
# :TODO: decide on final set
# @see https://github.com/dyne/reflow-os/issues/16
# @see https://lab.allmende.io/valueflows/vf-schemas/vf-graphql/-/issues/90
#
# @package  vf-graphql
# @since    2021-11-27
